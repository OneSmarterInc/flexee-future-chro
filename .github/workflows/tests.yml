name: tests

on:
  push:
    branches:
      - main
      - v1
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    name: SQLite CI, code style and types
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate Wayfinder routes
        run: php artisan wayfinder:generate --with-form

      - name: Check frontend code
        run: npm run check

      - name: Check TypeScript types
        run: npm run types:check

      - name: Build frontend assets
        run: npm run build

      # The deploy workflow sends this exact build to the server, so the server never builds.
      - name: Keep the frontend build for the deploy workflow
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chro-frontend-build
          path: public/build
          if-no-files-found: error
          retention-days: 14

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Check PHP code style
        run: vendor/bin/pint --parallel --test

      - name: Check PHP types (PHPStan level 7)
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: Run Laravel test suite on SQLite
        run: php artisan test


  mysql:
    name: MySQL 8.4 CI
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: flexee_chro_test
          MYSQL_USER: flexee
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u flexee --password=secret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: flexee_chro_test
      DB_USERNAME: flexee
      DB_PASSWORD: secret
      DB_CHARSET: utf8mb4
      DB_COLLATION: utf8mb4_0900_ai_ci

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate Wayfinder routes
        run: php artisan wayfinder:generate --with-form

      - name: Check frontend code
        run: npm run check

      - name: Check TypeScript types
        run: npm run types:check

      - name: Build frontend assets
        run: npm run build

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Verify clean MySQL migration and seed
        run: php artisan migrate:fresh --seed --no-interaction

      - name: Run Laravel test suite on MySQL
        run: php artisan test

  mariadb:
    name: MariaDB 10.11 CI (matches GoDaddy)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: flexee_chro_test
          MARIADB_USER: flexee
          MARIADB_PASSWORD: secret
          MARIADB_ROOT_PASSWORD: root-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: flexee_chro_test
      DB_USERNAME: flexee
      DB_PASSWORD: secret
      DB_CHARSET: utf8mb4
      DB_COLLATION: utf8mb4_unicode_ci

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate Wayfinder routes
        run: php artisan wayfinder:generate --with-form

      - name: Check frontend code
        run: npm run check

      - name: Check TypeScript types
        run: npm run types:check

      - name: Build frontend assets
        run: npm run build

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Verify clean MariaDB migration and seed
        run: php artisan migrate:fresh --seed --no-interaction

      - name: Run Laravel test suite on MariaDB
        run: php artisan test