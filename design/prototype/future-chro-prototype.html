<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Future CHRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, exact, a partner's briefing pack
   IDEA: the firm's year-end working papers, one tab per step
   PICTURE: the live working area of each step (table, cards, results)
   COLOUR and TYPE: white, ink #101418, slate, one yellow slab for the key figure, Flexee red badge; Manrope
   LAYOUT: sticky bar, step tabs, one working column up to 1100px */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#101418);--ink:light-dark(#101418,#eef0f2);--soft:light-dark(#5b6470,#a9b0b9);--line:light-dark(#e3e6ea,#2a3038);--panel:light-dark(#f6f7f8,#171c22);--hi:#ffd84a;--red:#EC1A22;--ok:light-dark(#1d6b3a,#7fd39b);--bad:light-dark(#a3261b,#ff8f84)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif;overflow-x:clip}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding:10px max(4vw,16px);flex-wrap:wrap}
.badge{width:34px;height:34px;border-radius:7px;background:var(--red);color:#fff;font-weight:800;display:grid;place-items:center;font-size:20px}
.brand{font-weight:800}.brand small{display:block;font-weight:500;color:var(--soft);font-size:13px}
.team{margin-left:auto;font-size:14px;color:var(--soft)}.team b{color:var(--ink)}
.clock{font-size:14px;padding:4px 10px;border-radius:20px;background:var(--panel)}
nav{display:flex;gap:4px;padding:0 max(4vw,16px) 8px;overflow-x:auto}
nav button{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--soft);border-radius:20px;padding:6px 12px;font:600 14px Manrope,sans-serif;min-height:36px;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:1100px;margin:0 auto;padding:clamp(20px,3vw,40px) max(4vw,16px) 80px}
h1{font-size:clamp(28px,4vw,42px);line-height:1.08;margin:0 0 12px;text-wrap:balance}
h2{font-size:22px;margin:28px 0 10px}h3{font-size:17px;margin:0 0 6px}
p{max-width:70ch}.soft{color:var(--soft)}
.slab{background:var(--hi);color:#101418;padding:2px 8px;border-radius:4px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:10px;padding:18px;background:var(--bg)}
.card.panel{background:var(--panel)}
.who{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.who button,.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 14px;font:600 15px Manrope,sans-serif;min-height:44px;cursor:pointer}
.who button.on,.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chat{border:1px solid var(--line);border-radius:10px;padding:12px;height:340px;overflow-y:auto;background:var(--panel)}
.msg{margin:0 0 10px;max-width:85%;padding:8px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.msg.me{margin-left:auto;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.msg.new{border-color:var(--hi);box-shadow:0 0 0 2px var(--hi) inset}
.ask{display:flex;gap:8px;margin-top:8px}.ask input{flex:1}
input,select,textarea{font:16px Manrope,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px;width:100%}
textarea{min-height:120px}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.sugg button{font-size:13px;padding:6px 10px;min-height:36px}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.row label{flex:1 1 220px}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 12px;min-height:40px;font:600 14px Manrope,sans-serif;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px;margin:16px 0}
.kpi{border:1px solid var(--line);border-radius:10px;padding:14px}.kpi b{display:block;font-size:clamp(20px,2.4vw,26px);white-space:nowrap}.kpi span{font-size:13px;color:var(--soft)}
.big{font-size:clamp(34px,5vw,52px);font-weight:800;line-height:1}
.quote{border-left:4px solid var(--hi);padding:4px 12px;margin:10px 0}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:28px;flex-wrap:wrap}
.note{font-size:13px;color:var(--soft)}
.found{border:1px solid var(--line);border-left:4px solid var(--hi);border-radius:8px;padding:10px 12px;margin:8px 0;background:var(--bg)}
@media(max-width:600px){table{font-size:14px}.chat{height:300px}.team{margin-left:0;width:100%}}
@media(prefers-reduced-motion:no-preference){.msg.new{animation:pop .35s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:0}}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="badge" aria-hidden="true">F</div>
    <div class="brand">The Future CHRO<small id="sub">Ashby Calder · January 2027</small></div>
    <div class="team">Team 3 · <b>North Partners</b></div>
    <div class="clock" id="clock">Table time: 15 min left</div>
  </div>
  <nav id="tabs" aria-label="Steps"></nav>
</header>
<main id="view"></main>
<script>// Port of chro/model.py simulate() (v0.3). Must reproduce the Python fixtures.
function chroEngine(D) {
  const FAM = ["delivery", "operations"];
  const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
  const clone = o => JSON.parse(JSON.stringify(o));
  const DEFAULT = { workflows: {}, tutor: 0, intake: { delivery: 1, operations: 1 }, mentoring: 0, layoffs: {},
    share_gains: false, transparency: false, oversight: "light", lateral: 0, knowledge: "people",
    planning: "hr", board_report: false, checking: false, ruth: "go" };
  const START_PIPE = (0.3 * 520 + 360) / (1180 * 1.04 * (0.165 + 0.0695));
  const C = D.C, L = D.L, M = D.M, T = D.T, W = D.W;
  const modes = Object.keys(M);
  const sum = a => a.reduce((s, x) => s + x, 0);

  function aiSplit(wf, caps, f) {
    const a = [0, 0, 0, 0], by = {}, rev = {};
    modes.forEach(m => { by[m] = [0, 0, 0, 0]; rev[m] = [0, 0, 0, 0]; });
    let risk = 0;
    for (const w of W[f]) {
      const m = wf[w.key] || "people", t = T[String(w.type)];
      for (let i = 0; i < 3; i++) {
        const s = w.share * Math.min(1, M[m].ai[i] * caps[i] * w.fit);
        a[i] += s; by[m][i] += s; rev[m][i] += s * t.review;
      }
      const err = (m === "draft_check" || m === "alone") ? t.error : 1;
      let r2 = 0; for (let i = 0; i < 2; i++) r2 += Math.min(1, M[m].ai[i] * caps[i] * w.fit);
      risk += w.share * w.risk * err * M[m].incident * r2 / 2;
    }
    return [a, by, risk, rev];
  }

  function simulate(team, future, lastYear) {
    const y0 = C.first_year, y1 = lastYear || C.last_year;
    const hc = {}; FAM.forEach(f => hc[f] = L[f].map(l => l.start_headcount));
    const start23 = sum(FAM.map(f => L[f][2].start_headcount + L[f][3].start_headcount));
    const baseIntake = {}; FAM.forEach(f => baseIntake[f] = L[f][0].start_headcount * (L[f][0].attrition_base + L[f][0].promo_base));
    let trust = C.trust_start, strain = C.strain_start, influence = C.influence_start, checkingYears = 0;
    const know = { people: C.knowledge_start, held: 0 };
    const d = clone(DEFAULT); const rows = []; const ruthY = C.ruth_year; let ruth = null, ruthLeft = false;
    for (let y = y0; y <= y1; y++) {
      const nw = team[String(y)]; let layoffs = {};
      if (nw) { for (const k in nw) { if (k === "workflows") Object.assign(d.workflows, clone(nw[k])); else d[k] = clone(nw[k]); } layoffs = nw.layoffs || {}; }
      d.layoffs = {};
      const fx = D.F[future + "|" + y];
      const caps = [fx.ai_entry_cap, fx.ai_mid_cap, fx.ai_expert_cap, 0];
      let cost = 0; const notes = []; const strong = d.oversight === "strong";
      // Ruth Adeyemi's terms are fixed by the 2032 decision (FF-D1)
      if (y === ruthY) ruth = d.ruth;
      if (ruth !== null && !ruthLeft && y === ruthY + { go: 0, capture: 1, stay: 2 }[ruth]) {
        const usual = C["knowledge_capture_" + d.knowledge];
        const kept = { go: usual, capture: Math.max(C.ruth_capture_share, usual), stay: Math.max(C.ruth_stay_capture, usual) }[ruth];
        know.people -= C.ruth_knowledge; know.held += C.ruth_knowledge * kept; hc.delivery[3] -= 1; ruthLeft = true;
        notes.push("Ruth Adeyemi retired; " + (100 * kept).toFixed(0) + "% of her knowledge kept");
      }
      const ruthFeeLoss = ruthLeft && ruth !== null ? C.ruth_fees * C["ruth_fee_loss_" + ruth] : 0;
      const ruthHere = ruth !== null && !ruthLeft;
      let laid = 0;
      for (const f in layoffs) layoffs[f].forEach((s, i) => { const n = hc[f][i] * s; hc[f][i] -= n; laid += n; cost += n * L[f][i].salary * C.severance_months / 12; });
      const totalStart = sum(FAM.map(f => sum(hc[f])));
      if (laid) {
        trust -= C.layoff_trust_hit * (laid / Math.max(1, totalStart + laid)) * 10;
        if (d.transparency) trust += 0.25 * C.layoff_trust_hit * (laid / (totalStart + laid)) * 10;
      }
      trust = clamp(trust + (d.share_gains ? C.share_gain_trust : 0) + (d.transparency ? C.transparency_trust : 0) + (d.board_report ? 0.5 : 0), 0, 100);
      if (y === C.vendor_terms_year && d.knowledge === "vendor") { const lk = know.held * C.vendor_knowledge_loss; know.held -= lk; notes.push("Vendor terms changed: " + lk.toFixed(0) + " points of firm knowledge lost"); }
      const knowledge = know.people + know.held;
      const kf = 1 - C.knowledge_productivity * (1 - Math.min(1.2, knowledge / C.knowledge_start));
      const prod = (1 + 0.004 * (trust - 60)) * (1 - C.strain_productivity * Math.max(0, strain - 40));
      const split = {}; FAM.forEach(f => split[f] = aiSplit(d.workflows, caps, f));
      const a = {}; FAM.forEach(f => a[f] = split[f][0]);
      const demand = C.demand_start * Math.pow(1 + C.demand_growth, y - y0);
      const mix = C.level_mix;
      const maturity = clamp((caps[0] - 0.20) / 0.75, 0, 1);
      const planReview = { hr: 1.10, it: 1.0, joint: 0.90 }[d.planning];
      const reviewRate = {}; modes.forEach(m => reviewRate[m] = (M[m].review + (strong && m !== "people" ? C.review_strong_extra : 0)) * (1 - C.review_learning_fall * maturity) * planReview);
      if (d.checking) checkingYears += 1;
      const checkFactor = 1 - C.checking_cut * Math.min(1, checkingYears / C.checking_build_years);
      const rpu = {}; FAM.forEach(f => { let s = 0; modes.forEach(m => { for (let i = 0; i < 3; i++) s += mix[i] * split[f][3][m][i] * reviewRate[m]; }); rpu[f] = checkFactor * s; });
      function units(f, scale) {
        const cap = [0, 1, 2, 3].map(i => hc[f][i] * L[f][i].work_per_person * prod * (i >= 2 ? kf : 1) * (1 - (i >= 2 ? d.mentoring : 0)));
        const need = [0, 1, 2, 3].map(i => mix[i] * (1 - a[f][i]) * scale);
        need[1] += rpu[f] * C.review_to_l1 * scale; need[2] += rpu[f] * (1 - C.review_to_l1) * scale;
        let u = Infinity;
        for (let k = 0; k < 4; k++) { const sn = sum(need.slice(k)); if (sn > 1e-12) u = Math.min(u, sum(cap.slice(k)) / sn); }
        return [u, cap];
      }
      const [uDel, capD] = units("delivery", 1), [uOps, capO] = units("operations", C.ops_support_ratio);
      let delivered = Math.min(demand, uDel, uOps);
      const aiShare = sum([0, 1, 2, 3].map(i => mix[i] * a.delivery[i]));
      const reviewUnits = delivered * (rpu.delivery + C.ops_support_ratio * rpu.operations);
      if (y === C.outage_year) {
        const spare = Math.max(0, Math.min(uDel, uOps) - delivered) / Math.max(delivered, 1e-9);
        const aiAll = sum(FAM.map(f => sum(split[f][0])));
        const aloneShare = sum(FAM.map(f => sum(split[f][1].alone))) / Math.max(aiAll, 1e-9);
        const spread = C.outage_alone_base + C.outage_alone_slope * aloneShare;
        const lost = C.outage_loss * spread * aiShare * delivered * Math.max(0, 1 - spare / Math.max(aiShare, 1e-9));
        delivered -= lost; notes.push("Outage cost " + lost.toFixed(0) + " units of work");
      }
      const revenue = delivered * C.revenue_per_unit * fx.price_index - ruthFeeLoss;
      const salaries = sum(FAM.map(f => sum([0, 1, 2, 3].map(i => hc[f][i] * L[f][i].salary))));
      let aiCost = 0, naive = 0, aiUnits = 0;
      [["delivery", 1], ["operations", C.ops_support_ratio]].forEach(([f, sc]) => { for (let i = 0; i < 3; i++) { const u = delivered * sc * mix[i] * a[f][i]; aiCost += u * fx.ai_cost_per_unit * L[f][i].salary / L[f][i].work_per_person; naive += u * L[f][i].salary / L[f][i].work_per_person; aiUnits += u; } });
      if (d.knowledge === "vendor" && y >= C.vendor_terms_year) aiCost *= 1 + C.vendor_cost_rise;
      if (d.planning === "it") aiCost *= 0.95;
      aiCost *= 1 + (strong ? C.oversight_cost : 0);
      const risk = sum(FAM.map(f => split[f][2] * (f === "delivery" ? 1 : C.ops_support_ratio)));
      const seniorUnits = sum([1, 2].map(i => capD[i] + capO[i]));
      const wallRatio = reviewUnits / Math.max(1e-9, C.wall_share * seniorUnits);
      const over = Math.max(0, wallRatio - 1);
      const incidents = fx.incident_rate * 100 * risk * (1 + C.strain_errors * Math.max(0, strain - 40)) * (1 + C.wall_errors * over) * (d.planning === "joint" ? 0.9 : 1);
      const incidentCost = incidents * C.incident_cost * (strong ? 1 - C.oversight_cut : 1);
      const regulation = fx.regulation_cost * revenue * aiShare * (strong ? 0.5 : 1);
      const bm0 = split.delivery[1], entryAi = a.delivery[0];
      const coached = entryAi > 0 ? (bm0.assist[0] + bm0.draft_check[0] * d.tutor) / entryAi : 0;
      const tutorCost = 8000 * hc.delivery[0] * coached;
      const hires = {}; FAM.forEach(f => hires[f] = baseIntake[f] * d.intake[f]);
      const hireCost = (hires.delivery + hires.operations) * 5000;
      const extra = { people: 0, firm: C.knowledge_cost_firm, vendor: C.knowledge_cost_vendor }[d.knowledge] + (d.planning === "joint" ? C.planning_joint_cost : 0) + (d.board_report ? C.board_report_cost : 0) + (d.checking ? C.checking_cost : 0) + (ruth === "stay" && ruthHere ? C.ruth_stay_cost : 0) + (ruth === "capture" && ruthHere ? C.ruth_capture_cost : 0);
      cost += salaries + aiCost + incidentCost + regulation + tutorCost + hireCost + C.overhead + extra;
      let profit = revenue - cost;
      const seniors = sum(FAM.map(f => hc[f][1] + hc[f][2]));
      const stretch = Math.max(0, delivered / Math.max(1e-9, Math.min(uDel, uOps)) - 0.95);
      strain += C.strain_per_review * reviewUnits / Math.max(1, seniors) + C.strain_per_stretch * stretch - (d.share_gains ? C.strain_relief_gains : 0) + (d.planning === "it" ? 1.5 : 0) + C.wall_strain * over - C.strain_recovery * (strain - C.strain_start);
      strain = clamp(strain, 0, 100);
      const ment = clamp((d.mentoring + (ruth === "stay" && ruthHere ? C.ruth_stay_mentor : 0)) / C.mentor_full, 0, 1);
      const latMarket = C.lateral_market_base * (future === "rapid" ? C.lateral_scarcity_rapid : 1);
      const bench = {}; let out23 = 0;
      for (const f of FAM) {
        const scale = f === "delivery" ? 1 : C.ops_support_ratio, bm = split[f][1];
        const nextNeed = [0, 1, 2, 3].map(i => demand * (1 + C.demand_growth) * scale * mix[i] * (1 - a[f][i]) / prod);
        const reps = i => { let lost = 0; modes.forEach(m => lost += bm[m][i] * M[m].lost); lost -= bm.draft_check[i] * d.tutor; let r = 1 - lost * C.substitute_penalty; if (i === 1) r -= C.check_deskill * (bm.draft_check[1] + bm.draft_check[0]); return r; };
        let h = hc[f].slice(); const out = [];
        for (let i = 0; i < 4; i++) {
          const attr = L[f][i].attrition_base + C.trust_attrition * Math.max(0, 60 - trust) + (i === 0 ? 0.06 * (1 - reps(0)) : 0) + ((i === 1 || i === 2) ? C.strain_attrition * Math.max(0, strain - 40) : 0);
          out.push(h[i] * (attr + L[f][i].retire));
        }
        out23 += out[2] + out[3];
        h = h.map((x, i) => x - out[i]);
        for (const i of [2, 1, 0]) {
          const assistShare = a[f][i] > 0 ? bm.assist[i] / Math.max(1e-9, a[f][i]) : 0;
          const tutorEff = a[f][i] > 0 ? clamp(assistShare + (1 - assistShare) * d.tutor, 0, 1) : 0;
          const tutorBonus = C.learn_tutor_bonus * tutorEff * Math.min(1, caps[0] / 0.5);
          const lf = C.learn_reps_weight * reps(i) + C.learn_mentor_weight * ment + (1 - C.learn_reps_weight - C.learn_mentor_weight) + tutorBonus;
          const ready = h[i] * L[f][i].promo_base * 2 * lf;
          const gap = Math.max(0, nextNeed[i + 1] - h[i + 1]);
          const p = Math.min(ready, gap); h[i] -= p; h[i + 1] += p;
          const still = Math.max(0, nextNeed[i + 1] - h[i + 1]);
          if (still > 0 && d.lateral > 0) { const lat = Math.min(still, d.lateral * latMarket * (h[i + 1] + still)); h[i + 1] += lat; profit -= lat * L[f][i + 1].salary * (C.lateral_cost_mult - 1); }
        }
        h[0] += hires[f]; hc[f] = h;
        bench[f] = (0.3 * h[0] + h[1]) / Math.max(1e-9, nextNeed[2] + nextNeed[3]) / START_PIPE;
      }
      const now23 = sum(FAM.map(f => hc[f][2] + hc[f][3]));
      const capture = C["knowledge_capture_" + d.knowledge];
      const leave = out23 / Math.max(1, now23 + out23);
      know.held += know.people * leave * capture; know.people -= know.people * leave;
      know.people += C.knowledge_renew * C.knowledge_start * Math.min(1, now23 / start23) * (0.85 + 0.15 * ment);
      know.people = clamp(know.people, 0, 1.2 * C.knowledge_start); know.held = clamp(know.held, 0, 0.6 * C.knowledge_start);
      influence = clamp(influence + ({ hr: 1, it: -3, joint: 2 }[d.planning]) + (d.board_report ? 2.5 : 0) + (profit > 0.15 * revenue ? 2 : -2) + (delivered / demand > 0.95 ? 1 : -2), 0, 100);
      trust += 0.10 * (60 - trust);
      rows.push({ year: y, demand, delivered, revenue, cost, profit, ai_cost: aiCost, naive_saving: naive, ai_units: aiUnits, review_units: reviewUnits, wall_ratio: wallRatio, strain, knowledge: know.people + know.held, influence, ai_share: aiShare, incidents, trust, headcount: sum(FAM.map(f => sum(hc[f]))), delivery_levels: hc.delivery.slice(), operations_levels: hc.operations.slice(), expert_bench: bench.delivery, met_demand: delivered / demand, notes });
    }
    return rows;
  }
  return { simulate };
}

</script>

function results() {
  const ran = S.rows.filter(r => r.year >= year() && r.year <= year() + 1);
  const r = ran[ran.length - 1], start = S.rows.find(x => x.year === year()) ;
  const band = r.profit >= 90e6 ? 0 : r.profit >= 75e6 ? 1 : r.profit >= 55e6 ? 2 : 3;
  const story = ["A strong two years. Profit held up, and the firm still does its own work well.", "A solid two years. AI is paying its way, and most of the cost of checking it is under control.", "A tight two years. The savings were smaller than hoped, checking took real hours, and some work slipped.", "A hard two years. Costs stayed high, work slipped, and people are worried about what comes next."][band];
  const quotes = [[["Analyst", "I'm learning the work, and the AI helps me learn it faster."], ["Manager", "We're busy, but it's the right kind of busy."], ["Partner", "Clients see the difference."]],
    [["Analyst", "Some days I draft, some days I check. I'd like more of the first."], ["Manager", "Checking takes time, but we've planned for it."], ["Partner", "We're moving. I want to see who's coming up behind us."]],
    [["Analyst", "Most days I review what the AI wrote. I'm not sure I'm learning the work."], ["Manager", "I spend my evenings checking drafts. Something has to give."], ["Partner", "The savings were real, but smaller than we were told."]],
    [["Analyst", "Half my friends here are gone. Who trains the rest of us now?"], ["Manager", "We're checking drafts with fewer people every year."], ["Partner", "I'm getting calls from clients about errors. That's new."]]][band];
  const notes = ran.flatMap(x => x.notes.map(n => x.year + ": " + n.replace("Outage cost", "the outage cost").replace("units of work", "people's worth of work").replace("Vendor terms changed:", "the vendor's new terms cost").replace("points of firm knowledge lost", "points of firm knowledge")));
  return `<h1>Results ${ran.map(x => x.year).join(" and ")}</h1>
<div class="grid" style="align-items:center"><div><p class="soft" style="margin:0">Profit in ${r.year}</p><div class="big"><span class="slab">${money(r.profit)}</span></div>
<p class="soft">${ran.map(x => x.year + ": " + money(x.profit)).join(" · ")}</p></div><div class="card panel"><p style="margin:0">${story}</p>${notes.length ? `<p style="margin:8px 0 0">${notes.map(n => esc(n)).join("<br>")}</p>` : ""}</div></div>
${kpis(r)}
<h2>People at each level, end of ${r.year}</h2>
<table><thead><tr><th>Level</th><th class="n">Client work</th><th class="n">2027</th><th class="n">Operations</th><th class="n">2027</th></tr></thead><tbody>
${["Entry", "Experienced", "Expert", "Leaders"].map((l, i) => `<tr><td>${l}</td><td class="n">${Math.round(r.delivery_levels[i])}</td><td class="n soft">${[520, 360, 210, 90][i]}</td><td class="n">${Math.round(r.operations_levels[i])}</td><td class="n soft">${[364, 252, 147, 63][i]}</td></tr>`).join("")}</tbody></table>
<h2>What your people say</h2>${quotes.map(q => `<div class="quote"><b>${q[0]}:</b> "${q[1]}"</div>`).join("")}
<h2>Looking ahead</h2><p>In one paragraph: what do you now believe about how fast AI is coming, and what will you change ${year() < 2031 ? "in " + (year() + 2) : "from here"}?</p>
<textarea id="para" placeholder="We now believe...">${esc(S.paragraphs[year()] || "")}</textarea>
<div class="foot"><button class="btn" data-step="3">Back</button><button class="btn main" id="next">${year() < 2031 ? "Go to " + (year() + 2) : "See the replay"}</button></div>`;
}

function summary(rows) {
  const profit = rows.reduce((s, r) => s + r.profit, 0), e = rows[rows.length - 1];
  const cl = (x, a, b) => Math.max(a, Math.min(b, x));
  const fin = cl(profit / 1e9, 0, 1), cap = cl(0.5 * Math.min(e.expert_bench, 1) + 0.5 * e.met_demand, 0, 1);
  return { profit, bench: e.expert_bench, trust: e.trust, overall: 100 * (0.40 * fin + 0.35 * cap + 0.25 * e.trust / 100) };
}
function replay() {
  const R = {}; ["rapid", "complement", "constrained"].forEach(f => R[f] = summary(eng.simulate(S.team, f)));
  const worst = Math.min(...Object.values(R).map(x => x.overall));
  const all = Object.entries(REF).concat([["Your team", worst]]).sort((a, b) => b[1] - a[1]);
  const max = 80;
  return `<h1>The replay</h1>
<p>The future that happened: <b>${FUT_NAMES[FUTURE]}</b>. Here are your exact decisions, held to 2035, in all three futures.</p>
<table><thead><tr><th>Future</th><th class="n">Profit 2027–2035</th><th class="n">Pipeline 2035</th><th class="n">Trust 2035</th><th class="n">Overall</th></tr></thead><tbody>
${Object.entries(R).map(([f, x]) => `<tr><td>${FUT_NAMES[f]}${f === FUTURE ? " <small class=\"soft\">(happened)</small>" : ""}</td><td class="n">${money(x.profit)}</td><td class="n">${x.bench.toFixed(2)}</td><td class="n">${Math.round(x.trust)}</td><td class="n"><b>${x.overall.toFixed(1)}</b></td></tr>`).join("")}</tbody></table>
<p class="soft">Overall: financial results 40%, capability (pipeline and work delivered) 35%, trust 25%.</p>
<h2>Your judgment: <span class="slab">${worst.toFixed(1)}</span></h2>
<p>Judgment is your worst overall result across the three futures. A plan that holds up in all three shows judgment. A plan that wins only in the future that happened shows luck.</p>
<div class="card">${all.map(([n, v]) => `<div class="row" style="margin:6px 0"><span style="flex:0 0 120px">${n === "Your team" ? "<b>Your team</b>" : { builder: "Builder", waiter: "Waiter", middle: "Middle", cutter: "Cutter" }[n]}</span><span style="flex:1;background:var(--panel);border-radius:4px;height:22px;position:relative"><span style="position:absolute;inset:0 auto 0 0;width:${Math.max(2, v / max * 100)}%;background:${n === "Your team" ? "var(--hi)" : "var(--line)"};border-radius:4px"></span></span><b style="flex:0 0 48px;text-align:right">${v.toFixed(1)}</b></div>`).join("")}
<p class="note">Builder: AI that helps people draft, steady hiring, strong checking. Waiter: no AI. Middle: AI drafts everywhere, light checking. Cutter: AI alone everywhere, with layoffs.</p></div>
<h2>Your three paragraphs</h2>${YEARS.map(y => `<p><b>${y}:</b> ${esc(S.paragraphs[y] || "(none written)")}</p>`).join("")}
<div class="row"><button class="btn main" id="copy">Copy our paragraphs</button><span class="note" id="copied"></span></div>`;
}

const VIEWS = [brief, table, moment, decide, results];
function render() { tabs(); $("#view").innerHTML = S.yi < 3 ? VIEWS[S.step]() : replay(); const c = $("#chat"); if (c) c.scrollTop = c.scrollHeight; clock(); }

function ask(q) {
  q = q.trim(); if (!q) return;
  const c = chat(S.person), T = TALK[year()][S.person];
  if (c.filter(m => m.me).length >= 8 || !spend(1)) return;
  c.forEach(m => m.fresh = false);
  const low = q.toLowerCase(), hit = T.hidden.find(h => !S.revealed[h.id] && h.keys.some(k => low.includes(k)));
  let a; if (hit) { S.revealed[hit.id] = true; a = { t: hit.say, fresh: true }; } else { const n = c.filter(m => !m.me).length; a = { t: T.free[n % T.free.length] }; }
  c.push({ me: true, t: q }, a); render(); const i = $("#q"); if (i) i.focus();
}

function confirmYear() {
  const y = year();
  S.team[String(y)] = { workflows: { ...S.wf }, tutor: S.tutor / 100, mentoring: S.mentoring / 100,
    intake: { delivery: y === 2027 ? S.offers / 230 : S.delIntake / 100, operations: S.opsIntake / 100 },
    oversight: S.oversight, lateral: S.lateral, transparency: S.transparency, share_gains: S.shareGains,
    layoffs: { delivery: [S.layDel / 100, 0, 0, 0], operations: [S.layOps / 100, 0, 0, 0] },
    planning: S.planning, knowledge: S.knowledge, board_report: S.boardReport, checking: S.checking };
  if (y === 2027) S.delIntake = Math.round(S.offers / 230 * 100 / 5) * 5;
  S.rows = eng.simulate(S.team, FUTURE, y + 1);
  S.layDel = 0; S.layOps = 0; S.step = 4;
}

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.step !== undefined) { S.step = +t.dataset.step; render(); scrollTo(0, 0); return; }
  if (t.dataset.person) { S.person = t.dataset.person; render(); return; }
  if (t.dataset.sugg) { ask(t.dataset.sugg); return; }
  if (t.dataset.check) { const k = PLANS[year()].checks.find(x => x.id === t.dataset.check); if (S.checkMin + k.min <= 10 && spend(k.min)) { S.checkMin += k.min; S.checks[k.id] = true; render(); } return; }
  const sg = t.closest(".seg");
  if (sg) { const key = sg.dataset.key, raw = t.dataset.val; S[key] = raw === "true" ? true : raw === "false" ? false : isNaN(+raw) ? raw : +raw; render(); return; }
  if (t.id === "confirm") { confirmYear(); render(); scrollTo(0, 0); return; }
  if (t.id === "next") { S.yi += 1; S.step = 0; S.minutes = 15; S.checkMin = 0; S.person = "daniel"; render(); scrollTo(0, 0); return; }
  if (t.id === "copy") { const txt = YEARS.map(y => y + ": " + (S.paragraphs[y] || "")).join("\n\n"); navigator.clipboard.writeText(txt).then(() => $("#copied").textContent = "Copied.", () => $("#copied").textContent = "Select the text and copy it."); }
});
document.addEventListener("submit", e => { if (e.target.id === "ask") { e.preventDefault(); ask($("#q").value); } });
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "offers") S.offers = Math.max(0, Math.min(230, Math.round(+t.value || 0)));
  if (t.id === "grads") S.toGrads = t.value;
  if (t.id === "memo") S.memo = t.value;
  if (t.id === "helen") S.helen = t.value;
  if (t.id === "para") S.paragraphs[year()] = t.value;
  if (t.id === "tutor") { S.tutor = +t.value; $("#tutorOut").textContent = t.value + "%"; }
  if (t.id === "ops") { S.opsIntake = +t.value; $("#opsOut").textContent = t.value + "%"; }
  if (t.id === "del") { S.delIntake = +t.value; $("#delOut").textContent = t.value + "%"; }
});
document.addEventListener("change", e => { const t = e.target; if (t.dataset.wf) S.wf[t.dataset.wf] = t.value; });
render();
}

</script>
</body>
</html>
